<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tech Products</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 20px auto; }
    form { display: grid; gap: 8px; margin-bottom: 20px; }
    input, textarea, button { padding: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Tech Products</h1>

  <form id="form">
    <input type="hidden" id="id">
    <input id="product_name" placeholder="Product name" required>
    <input id="category" placeholder="Category">
    <input id="brand" placeholder="Brand">
    <input id="price" type="number" step="0.01" placeholder="Price">
    <input id="stock_quantity" type="number" placeholder="Stock">
    <textarea id="description" placeholder="Description"></textarea>
    <button type="submit">Save</button>
  </form>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Category</th><th>Brand</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
